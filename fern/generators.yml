# yaml-language-server: $schema=https://schema.buildwithfern.dev/generators-yml.json
api:
  specs:
    # A LOCAL path, fetched from the live API before generation. Not a URL.
    #
    # `generators.yml` does not accept an https URL here, despite the quickstart implying
    # otherwise: `fern init --openapi <url>` DOWNLOADS the spec to a temp file and writes a
    # local path, and pointing this key at a URL fails with "Missing file". Verified both
    # ways rather than assumed.
    #
    # So the spec is fetched into openapi/ before generating, by `bun run spec:pull` (see
    # package.json) or by CI. That keeps the property that actually mattered: generation
    # reads what PRODUCTION serves, not a sibling checkout of a private repo, so CI needs no
    # cross-repo token and the path does not depend on where anyone cloned things.
    #
    # openapi/v1.yaml is gitignored: it is a cache of the live contract, and committing it
    # would create a second copy of the truth that can silently drift.
    - openapi: ../openapi/v1.yaml
default-group: local
groups:
  local:
    generators:
      - name: fern-typescript-sdk
        output:
          location: local-file-system
          path: ../sdks/typescript
        version: 3.88.0
        # ── NO `config:` BLOCK HERE, DELIBERATELY ──────────────────────────────
        # Adding one to this generator version silently breaks generation: the CLI still
        # prints "Wrote files to ..." and "Finished", and zero files appear. Bisected it
        # to the block itself rather than to any particular key, and it is not about the
        # package name being npm-scoped (an unscoped name failed the same way as a scoped
        # one).
        #
        # So package metadata (name, version, description) is NOT set here yet, which is
        # why `--package` cannot build an npm tarball: the generator emits either no
        # package.json or one named "test-package" with an empty version, and `npm pack`
        # refuses it.
        #
        # That is fine while nothing is published. Before publishing, resolve it one of:
        #   1. try a newer generator version (3.88.0 is what `fern init` pinned)
        #   2. report it to Fern with this repro
        #   3. write package.json as a post-generation step in CI
        #
        # Do not "fix" this by re-adding a config block without re-running
        # `fern generate --local` and COUNTING THE FILES. A success message is not
        # evidence here.
