# yaml-language-server: $schema=https://schema.buildwithfern.dev/generators-yml.json
api:
  specs:
    # Fetched over HTTP from the API itself, not read from a sibling checkout.
    #
    # The previous value was a relative path into ../../proof-of-concept-2, which assumed
    # both repos were cloned side by side. That works on one laptop and nowhere else: a CI
    # runner has no sibling, and the API repo is private, so generating in CI would have
    # needed a cross-repo token just to read a file.
    #
    # This URL is public and unauthenticated (see the route's comment in v1/router.ts for
    # why a spec is not a secret), so `fern generate --local` behaves the same here and in
    # CI with no credentials at all.
    #
    # It also means the SDK is generated from what production actually serves rather than
    # from whatever is on the local disk, which is the version customers experience.
    #
    # PENDING: the route ships in the API repo's feat/v1-spec-route branch and returns 404
    # in production until that merges and deploys. Until then the local path below is the
    # working source; swap to the URL once `curl -sI https://trycontexthub.com/v1/openapi.yaml`
    # returns 200. Both lines are kept so the switch is one comment move, not a rewrite.
    #
    # - openapi: https://trycontexthub.com/v1/openapi.yaml
    - openapi: ../../proof-of-concept-2/openapi/v1.yaml
default-group: local
groups:
  local:
    generators:
      - name: fern-typescript-sdk
        output:
          location: local-file-system
          path: ../sdks/typescript
        version: 3.88.0
        # ── NO `config:` BLOCK HERE, DELIBERATELY ──────────────────────────────
        # Adding one to this generator version silently breaks generation: the CLI still
        # prints "Wrote files to ..." and "Finished", and zero files appear. Bisected it
        # to the block itself rather than to any particular key, and it is not about the
        # package name being npm-scoped (`contexthub` fails the same way as
        # `@contexthub/sdk`).
        #
        # So package metadata (name, version, description) is NOT set here yet, which is
        # why `--package` cannot build an npm tarball: the generator emits either no
        # package.json or one named "test-package" with an empty version, and `npm pack`
        # refuses it.
        #
        # That is fine while nothing is published. Before publishing, resolve it one of:
        #   1. try a newer generator version (3.88.0 is what `fern init` pinned)
        #   2. report it to Fern with this repro
        #   3. write package.json as a post-generation step in CI
        #
        # Do not "fix" this by re-adding a config block without re-running
        # `fern generate --local` and COUNTING THE FILES. A success message is not
        # evidence here.
