# Is the committed SDK the one the spec produces?
#
# The generated tree is committed (see .gitignore for why), which creates exactly one new
# failure mode: someone edits it by hand, or the spec moves and nobody regenerates. Either
# way the repo ships an SDK that does not match the API.
#
# So CI regenerates and diffs. A clean diff means the committed code is reproducible; a
# dirty one means the tree and the spec disagree, and the log says which files.
#
# It does NOT publish. Nothing is on npm yet, and publishing is blocked on a generator bug
# that stops `--package` producing a valid package.json (documented in fern/generators.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # So a spec change in the API repo can trigger regeneration here.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned deliberately: the generator writes the whole tree, so an unpinned version bump
  # would show up as a large unexplained diff in this job rather than as a decision.
  FERN_VERSION: "5.98.3"

jobs:
  generated-code-is-current:
    name: Committed SDK matches the spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The API repo is private, so this job cannot clone it to read the spec from disk.
      # It reads the spec over HTTPS from the API itself instead, which needs no
      # credential. Until GET /v1/openapi.yaml is deployed, generators.yml still points at
      # a sibling path that does not exist on a runner, so this step reports that clearly
      # rather than failing with a confusing path error.
      - name: Check the spec source is reachable
        id: spec
        run: |
          if grep -qE '^\s*-\s*openapi:\s*https://' fern/generators.yml; then
            url=$(grep -oE 'https://[^ ]+openapi\.yaml' fern/generators.yml | head -1)
            echo "spec URL: $url"
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            echo "HTTP $code"
            if [ "$code" != "200" ]; then
              echo "::error::spec URL returned $code; generation cannot run"
              exit 1
            fi
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::generators.yml still points at a local sibling path, which does not exist on a runner. Skipping regeneration until GET /v1/openapi.yaml is deployed and the URL is switched on."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.spec.outputs.ready == 'true'
        with:
          bun-version: "1.3.11"

      # The repo's own registry may be a private mirror; force the public one so the CLI
      # installs on any runner.
      - name: Install the Fern CLI
        if: steps.spec.outputs.ready == 'true'
        run: bun add -g fern-api@${{ env.FERN_VERSION }} --registry https://registry.npmjs.org

      # --local runs the official generator containers under Docker, so this needs no Fern
      # account and no FERN_TOKEN. Docker is preinstalled on ubuntu-latest.
      - name: Regenerate
        if: steps.spec.outputs.ready == 'true'
        run: fern generate --local

      # The assertion. A dirty tree means the committed SDK is not what the spec produces.
      - name: Committed SDK is up to date
        if: steps.spec.outputs.ready == 'true'
        run: |
          if [ -n "$(git status --porcelain sdks/)" ]; then
            echo "::error::The committed SDK does not match the spec. Run 'fern generate --local' and commit the result."
            git status --porcelain sdks/
            git --no-pager diff --stat sdks/ | tail -20
            exit 1
          fi
          echo "Committed SDK matches the spec."

  builds:
    name: Generated SDK compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      # There is no package.json yet (see fern/generators.yml for the generator bug that
      # blocks it), so this bundles the entry point rather than running a package build.
      # It still catches the thing worth catching: generated code that does not parse or
      # has unresolvable imports.
      - name: Bundle the entry point
        run: |
          cd sdks/typescript
          bun build --target=node index.ts --outfile /dev/null
